<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Interception Remote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1a1a2e;color:#eee;font-family:sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#toolbar{display:flex;gap:5px;padding:6px 8px;background:#16213e;flex-wrap:wrap;align-items:center;z-index:10;flex-shrink:0}
.btn{padding:7px 10px;border:none;border-radius:8px;background:#0f3460;color:#fff;font-size:12px;cursor:pointer;touch-action:manipulation;user-select:none;flex-shrink:0}
.btn:active{background:#e94560}
#screen-wrap{flex:1;position:relative;overflow:hidden;touch-action:none}
#screen{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#kb-area{display:none;padding:8px;background:#16213e;flex-shrink:0}
#txtin{width:100%;padding:8px;background:#0f3460;border:1px solid #e94560;border-radius:8px;color:#fff;font-size:16px}
#ov{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;touch-action:none}
#cur{position:absolute;width:14px;height:14px;border:2px solid #e94560;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);z-index:6;display:none;background:rgba(233,69,96,.3)}
#st{font-size:10px;margin-left:auto;color:#0f0;flex-shrink:0;padding:2px 8px;background:#0a2a0a;border-radius:4px;font-weight:bold}
#fab{position:fixed;bottom:20px;right:20px;width:52px;height:52px;border-radius:50%;background:#e94560;border:none;color:#fff;font-size:22px;cursor:pointer;z-index:100;touch-action:manipulation}
#chat{position:fixed;bottom:0;left:0;right:0;height:70vh;background:#16213e;border-radius:20px 20px 0 0;z-index:99;transform:translateY(100%);transition:transform .3s;display:flex;flex-direction:column}
#chat.open{transform:translateY(0)}
#ch{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #0f3460;flex-shrink:0}
#ch h3{font-size:15px;color:#e94560}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:90%;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;word-break:break-word}
.m.u{background:#0f3460;align-self:flex-end}
.m.b{background:#1a3a5c;align-self:flex-start}
#cia{display:flex;gap:8px;padding:10px;border-top:1px solid #0f3460;flex-shrink:0}
#ci{flex:1;padding:10px;background:#0f3460;border:none;border-radius:8px;color:#fff;font-size:14px}
#cs{padding:10px 14px;background:#e94560;border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer}
</style>
</head><body>
<div id="toolbar">
  <button class="btn" onclick="tkb()">KB</button>
  <button class="btn" onclick="sk('Escape')">ESC</button>
  <button class="btn" onclick="sc('ctrl+c')">Copy</button>
  <button class="btn" onclick="sc('ctrl+v')">Paste</button>
  <button class="btn" onclick="sc('ctrl+z')">Undo</button>
  <button class="btn" onclick="sc('alt+F4')">X</button>
  <button class="btn" onclick="sm('vol_down')">VOL-</button>
  <button class="btn" onclick="sm('vol_up')">VOL+</button>
  <span id="st">CTRL</span>
</div>
<div id="screen-wrap">
  <img id="screen" src="/screenshot?t=0" alt="">
  <div id="ov"></div><div id="cur"></div>
</div>
<div id="kb-area"><input id="txtin" type="text" placeholder="Taper..." autocomplete="off"></div>
<button id="fab" onclick="tc()">AI</button>
<div id="chat">
  <div id="ch"><h3>Interception AI</h3><button onclick="tc()" style="background:none;border:none;color:#aaa;font-size:20px">X</button></div>
  <div id="msgs"><div class="m b">Salut ! Pose une question...</div></div>
  <div id="cia"><input id="ci" type="text" placeholder="Demande..."><button id="cs" onclick="ai()">GO</button></div>
</div>
<script>
function c(a,d){fetch('/ctrl/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).catch(()=>{})}
fetch('/screenshot').then(()=>{document.getElementById('st').textContent='ACTIF';}).catch(()=>{document.getElementById('st').textContent='OFF';document.getElementById('st').style.color='#f00'});
const ov=document.getElementById('ov'),cur=document.getElementById('cur');
let lt=null,dr=false,tf=false,ld=0;
function gp(e){const r=document.getElementById('screen').getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:Math.max(0,Math.min(1,(t.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(t.clientY-r.top)/r.height))};}
function mc(e){const r=document.getElementById('screen').getBoundingClientRect(),t=e.touches?e.touches[0]:e;cur.style.left=(t.clientX-r.left)+'px';cur.style.top=(t.clientY-r.top)+'px';}
ov.addEventListener('touchstart',e=>{e.preventDefault();if(e.touches.length===2){tf=true;const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY;ld=Math.sqrt(dx*dx+dy*dy);return;}tf=false;const p=gp(e);lt=p;c('move',p);cur.style.display='block';mc(e);},{passive:false});
ov.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===2){const dx=e.touches[1].clientX-e.touches[0].clientX,dy=e.touches[1].clientY-e.touches[0].clientY,dist=Math.sqrt(dx*dx+dy*dy),delta=ld-dist;if(Math.abs(delta)>5){c('scroll',{dy:delta>0?-3:3});ld=dist;}return;}const p=gp(e);mc(e);c(dr?'drag':'move',p);lt=p;},{passive:false});
ov.addEventListener('touchend',e=>{e.preventDefault();cur.style.display='none';if(dr){c('drag',{...lt,end:true});dr=false;}},{passive:false});
let tt=null,tc2=0;
ov.addEventListener('click',e=>{const p=gp(e);tc2++;if(tc2===1){tt=setTimeout(()=>{c('click',p);tc2=0;},250);}else{clearTimeout(tt);c('click',{...p,double:true});tc2=0;}});
let lpt=null;
ov.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const p=gp(e);lpt=setTimeout(()=>{c('click',{...p,right:true});navigator.vibrate&&navigator.vibrate(50);},600);},{passive:true});
ov.addEventListener('touchend',()=>clearTimeout(lpt),{passive:true});
ov.addEventListener('touchmove',()=>clearTimeout(lpt),{passive:true});
function sk(k){c('key',{key:k});}function sc(k){c('key',{combo:k});}function sm(a){fetch('/media/'+a).catch(()=>{});}
function tkb(){const a=document.getElementById('kb-area');a.style.display=a.style.display==='block'?'none':'block';if(a.style.display==='block')document.getElementById('txtin').focus();}
const ti=document.getElementById('txtin');let pv='';
ti.addEventListener('input',()=>{const v=ti.value;if(v.length>pv.length)c('type',{text:v.slice(pv.length)});else if(v.length<pv.length)c('key',{key:'Backspace'});pv=v;});
ti.addEventListener('keydown',e=>{if(e.key==='Enter'){c('key',{key:'Enter'});ti.value='';pv='';}});
const si=document.getElementById('screen');
function rf(){si.src='/screenshot?t='+Date.now();}
si.onload=()=>setTimeout(rf,100);si.onerror=()=>setTimeout(rf,1000);rf();
function tc(){document.getElementById('chat').classList.toggle('open');}
function am(r,h){const m=document.getElementById('msgs'),d=document.createElement('div');d.className='m '+r;d.innerHTML=h;m.appendChild(d);m.scrollTop=m.scrollHeight;return d;}
async function ai(){const inp=document.getElementById('ci'),msg=inp.value.trim();if(!msg)return;inp.value='';am('u',msg);const t=am('b','...');try{const r=await fetch('/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();t.remove();am('b',d.reply||'...');}catch(e){t.remove();am('b','Erreur');}}
document.getElementById('ci').addEventListener('keydown',e=>{if(e.key==='Enter')ai();});
</script></body></html>
