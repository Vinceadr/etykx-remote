name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p android/gradle/wrapper
          curl -L -o android/gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar" || \
          wget -O android/gradle/wrapper/gradle-wrapper.jar \
            "https://services.gradle.org/distributions/gradle-8.4-wrapper.jar" || true
          # Fallback: generate wrapper with system gradle
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            cd android && gradle wrapper --gradle-version 8.4 --no-daemon
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: interception-remote-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: "Interception Remote v${{ github.run_number }}"
          body: |
            ## 📱 Interception Remote — APK Android

            ### Installation
            1. Télécharge `app-debug.apk`
            2. Sur ton téléphone : Paramètres → Sécurité → **Sources inconnues** ✅
            3. Installe l'APK
            4. Entre l'IP de ton PC et le port 5000

            ### Prérequis
            - PC et téléphone sur le même Wi-Fi
            - Serveur Python lancé (automatique au démarrage du PC)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
