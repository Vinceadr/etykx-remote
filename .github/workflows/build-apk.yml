name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: etykx-remote-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: "ETYKX Remote v${{ github.run_number }}"
          body: |
            ## 📱 ETYKX Remote — APK Android

            ### Installation
            1. Télécharge `etykx-remote.apk`
            2. Sur ton téléphone : Paramètres → Sécurité → Sources inconnues ✅
            3. Installe l'APK
            4. Entre l'IP de ton PC et le port 5000

            ### Prérequis
            - PC et téléphone sur le même Wi-Fi
            - Serveur Python lancé : `.\start.ps1`
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
